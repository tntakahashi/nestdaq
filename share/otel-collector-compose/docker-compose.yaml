services:
  opensearch:
    image: docker.io/opensearchproject/opensearch:3
    container_name: opensearch
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - ${OPENSEARCH_DATA_DIR:-./opensearch-data}:/usr/share/opensearch/data:Z
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9200'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - otel-net

  opensearch-dashboards:
    image: docker.io/opensearchproject/opensearch-dashboards:3
    container_name: dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    volumes:
      - ${OPENSEARCH_DASHBOARDS_CONFIG_FILE:-./opensearch_dashboards.yaml}:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yaml:ro,Z
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - otel-net

  victoriametrics:
    image: docker.io/victoriametrics/victoria-metrics:v1.143.0
    container_name: victoriametrics
    profiles: ["victoria"]
    command:
      - -storageDataPath=/victoria-metrics-data
    ports:
      - "${VICTORIAMETRICS_PORT:-8428}:8428"
    volumes:
      - ${VICTORIAMETRICS_DATA_DIR:-./victoriametrics-data}:/victoria-metrics-data:Z
    networks:
      - otel-net

  victorialogs:
    image: docker.io/victoriametrics/victoria-logs:v1.50.0
    container_name: victorialogs
    profiles: ["victoria"]
    command:
      - -storageDataPath=/victoria-logs-data
    ports:
      - "${VICTORIALOGS_PORT:-9428}:9428"
    volumes:
      - ${VICTORIALOGS_DATA_DIR:-./victorialogs-data}:/victoria-logs-data:Z
    networks:
      - otel-net

  victoriatraces:
    image: docker.io/victoriametrics/victoria-traces:v0.8.2
    container_name: victoriatraces
    profiles: ["victoria"]
    command:
      - -storageDataPath=/victoria-traces-data
    ports:
      - "${VICTORIATRACES_PORT:-10428}:10428"
    volumes:
      - ${VICTORIATRACES_DATA_DIR:-./victoriatraces-data}:/victoria-traces-data:Z
    networks:
      - otel-net

  grafana:
    image: docker.io/grafana/grafana:12.4.0
    container_name: grafana
    profiles: ["victoria"]
    environment:
      GF_INSTALL_PLUGINS: "victoriametrics-metrics-datasource,victoriametrics-logs-datasource"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ${GRAFANA_DATA_DIR:-./grafana-data}:/var/lib/grafana:Z
      - ${GRAFANA_PROVISIONING_DIR:-./grafana/provisioning}:/etc/grafana/provisioning:ro,Z
    depends_on:
      - victoriametrics
      - victorialogs
      - victoriatraces
    networks:
      - otel-net

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.150.1
    container_name: otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ${OTEL_COLLECTOR_CONFIG_FILE:-./otel-collector-config.yaml}:/etc/otel/config.yaml:ro,Z
    ports:
      - "${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"   # OTLP HTTP
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - otel-net

networks:
  otel-net:
    name: otel-net
